name: my_downloader
description: A multi-platform video downloader app (Flutter frontend for the Node.js/yt-dlp backend).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.5.0

  # State/navigation
  go_router: ^14.2.0
  flutter_animate: ^4.5.0

  # Clipboard
  # (flutter/services Clipboard is built-in, no package needed)

  # Local storage for history
  shared_preferences: ^2.2.3

  # Downloading + saving files to device
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  gallery_saver_plus: ^3.2.4

  # Nice cached network images for thumbnails
  cached_network_image: ^3.3.1
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  video_player: ^2.9.1
  flutter_native_video_trimmer: ^1.1.9
  get_thumbnail_video: ^0.7.3
  file_picker: ^8.0.0+1
  ffmpeg_kit_flutter_new: ^4.6.2
  google_fonts: ^6.2.1
  google_mobile_ads: ^9.1.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/app_logo.png
